name: Deploy to RUN

# Every push to the game branch is checked and deployed (unlisted; publishing
# is a separate, hand-run workflow). Docs-only changes don't deploy.
on:
  push:
    branches:
      - claude/happy-mayer-ufwo5m
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
  workflow_dispatch:

concurrency:
  group: rundot-deploy
  cancel-in-progress: false

env:
  # Store listing, applied after each deploy when set. Keywords (tags) drive RUN
  # search and recommendations. RUN adds set-keywords to the game's existing tags
  # (at most 30), so the step first deletes the listed and the retired ones.
  GAME_DESCRIPTION: "Your plane goes down on a huge island, and the other passengers are turning into plants. Gather, craft tools, build a camp, keep your fire burning and survive the nights while the Bloom hunts you. Find the three radio parts, solve your way off the island and call for rescue. Every island is different: pick its climate, coast and layout, and set the rules, from a relaxed build to a nightmare. Play solo or with up to 3 friends. Mishmash is built by its players: vote on what gets added next and chat in the Town Square!"
  GAME_KEYWORDS: 'survival,crafting,base-building,horror,island,co-op,multiplayer,open-world,exploration,monsters,community-build,voting,halloween,spooky,community,player-made,chat,social'
  GAME_KEYWORDS_RETIRED: 'casual'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNDOT_API_KEY: ${{ secrets.RUNDOT_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install RUN CLI
        run: |
          curl -fsSL https://github.com/series-ai/rundot-cli-releases/releases/latest/download/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preflight
        run: rundot preflight --strict

      - name: Check deploy setup
        id: setup
        run: |
          if [ -z "$RUNDOT_API_KEY" ]; then
            echo "::warning::RUNDOT_API_KEY secret is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f game.config.prod.json ]; then
            echo "::warning::game.config.prod.json is not committed (run rundot init); skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to RUN
        if: steps.setup.outputs.ready == 'true'
        run: printf '%s' "$RUNDOT_API_KEY" | rundot login --api-key-stdin

      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        run: rundot deploy --orientation Portrait

      - name: Set keywords and description
        if: steps.setup.outputs.ready == 'true'
        run: |
          if [ -n "$GAME_KEYWORDS" ]; then
            for k in $(echo "$GAME_KEYWORDS_RETIRED,$GAME_KEYWORDS" | tr ',' ' '); do
              rundot game delete-keyword "$k" > /dev/null 2>&1 || true
            done
            rundot game set-keywords "$GAME_KEYWORDS"
          fi
          if [ -n "$GAME_DESCRIPTION" ]; then rundot game set-description "$GAME_DESCRIPTION"; fi
